name: Deploy Firebase Functions

on:
  push:
    branches:
      - "release/*"
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create Functions virtual environment
        working-directory: functions
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write Firebase service account key
        shell: bash
        run: |
          cat <<'EOF' > "$RUNNER_TEMP/firebase-sa.json"
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          EOF

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Prepare dotenv file for Functions runtime
        working-directory: functions
        run: cp envs/env.env .env

      - name: Deploy Firebase Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: firebase deploy --only functions,hosting --project "$FIREBASE_PROJECT_ID"